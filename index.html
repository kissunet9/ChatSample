<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSample - 1:1 실시간 채팅 서비스</title>
  <meta name="description" content="인증 없이 닉네임과 방 제목 입력만으로 쉽고 빠른 1:1 실시간 웹 채팅 서비스">
  
  <!-- Custom Light Theme CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase JS SDK (v9 compat mode via CDN for browser) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <!-- Firebase Project Configuration ('chatsample') -->
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="app-container" id="app">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>ChatSample</span>
      </div>
      <span class="badge-light">Firebase Project: chatsample</span>
    </header>

    <!-- 1. Chat List View (PAGE 1) -->
    <main id="listView" class="view">
      <div class="list-view-header">
        <div class="list-title-group">
          <h2>채팅방 목록</h2>
          <p>참여 가능한 1:1 대화방을 선택하거나 새로운 방을 만들어 보세요.</p>
        </div>
        <button id="openCreateModalBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          채팅방 만들기
        </button>
      </div>

      <div class="room-list-container">
        <div id="roomGrid" class="room-grid">
          <!-- Room cards dynamically populated here -->
        </div>

        <div id="emptyListState" class="empty-state hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h3>현재 개설된 채팅방이 없습니다.</h3>
          <p>상단의 '채팅방 만들기' 버튼을 눌러 새로운 대화를 시작해보세요!</p>
        </div>
      </div>
    </main>

    <!-- 2. Chat Room View (PAGE 2) -->
    <main id="chatView" class="view hidden">
      <div class="chat-room-header">
        <div class="room-info-group">
          <h3 id="currentRoomTitle">채팅방 이름</h3>
          <div class="room-info-meta">
            <span>방장: <strong id="currentRoomCreator">-</strong></span>
            <span>내 닉네임: <strong id="currentUserNickname">-</strong></span>
          </div>
        </div>
        <button id="leaveRoomBtn" class="btn btn-danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          나가기
        </button>
      </div>

      <div id="messagesContainer" class="messages-container">
        <!-- Chat bubbles rendered here -->
      </div>

      <form id="messageForm" class="message-input-form">
        <input type="text" id="messageInput" class="input-field" placeholder="메시지를 입력하세요..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          전송
        </button>
      </form>
    </main>

    <!-- Modal: Create Room (FEAT-02) -->
    <div id="createRoomModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>새 채팅방 만들기</h3>
          <p>채팅방 이름과 사용할 닉네임을 입력해 주세요.</p>
        </div>
        <div class="form-group">
          <label for="createRoomTitle">채팅방 이름</label>
          <input type="text" id="createRoomTitle" class="input-field" placeholder="예: 즐거운 수다방" required>
        </div>
        <div class="form-group">
          <label for="createNickname">내 닉네임</label>
          <input type="text" id="createNickname" class="input-field" placeholder="예: 홍길동" required>
        </div>
        <div class="modal-actions">
          <button id="cancelCreateBtn" class="btn btn-secondary">취소</button>
          <button id="confirmCreateBtn" class="btn btn-primary">확인</button>
        </div>
      </div>
    </div>

    <!-- Modal: Join Room (FEAT-03) -->
    <div id="joinRoomModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="joinModalRoomTitle">채팅방 참여</h3>
          <p>채팅방에서 사용할 닉네임을 입력해 주세요.</p>
        </div>
        <div class="form-group">
          <label for="joinNickname">내 닉네임</label>
          <input type="text" id="joinNickname" class="input-field" placeholder="예: 이순신" required>
        </div>
        <div class="modal-actions">
          <button id="cancelJoinBtn" class="btn btn-secondary">취소</button>
          <button id="confirmJoinBtn" class="btn btn-primary">참여</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
